<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telecom Simulator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- JANELA PRINCIPAL -->
    <div id="game-window">

        <!-- BARRA SUPERIOR -->
        <div id="title-bar">

            <div id="title">
                Telecom Simulator
            </div>

            <div id="window-controls">
                <button id="minimize">−</button>
                <button id="maximize">□</button>
                <button id="close">×</button>
            </div>

        </div>


        <!-- ÁREA PRINCIPAL -->
        <div id="game-content">

            <!-- MENU PRINCIPAL -->
            <div id="main-menu">

                <button id="play-button">
                    Jogar
                </button>

                <button id="new-game-button">
                    Novo Jogo
                </button>

                <button id="continue-button">
                    Continuar
                </button>

                <button id="load-button">
                    Carregar Jogo
                </button>

                <button id="settings-button">
                    Configurações
                </button>

                <button id="exit-button">
                    Sair
                </button>

            </div>


            <!-- INTERFACE DO JOGO -->
            <div id="game-interface">

                <!-- ABAS -->
                <nav id="navigation-tabs">
                    <!-- As abas com seus sprites entrarão aqui -->
                </nav>


                <!-- CONTEÚDO -->
                <main id="content-area">

                    <!-- Conteúdo de cada aba aparecerá aqui -->

                </main>

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->
    <script src="js/game.js"></script>

</body>
</html>
