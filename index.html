<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom Simulator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- JANELA PRINCIPAL DO JOGO -->
    <div id="game-window">

        <!-- MENU PRINCIPAL -->
        <div id="main-menu">
            <h1 class="game-title">Telecom Simulator</h1>
            <div class="menu-buttons">
                <button id="play-button" class="btn">Jogar</button>
                <button id="new-game-button" class="btn">Novo Jogo</button>
                <button id="continue-button" class="btn">Continuar</button>
                <button id="settings-button" class="btn">Configurações</button>
                <button id="exit-button" class="btn">Sair</button>
            </div>
        </div>

        <!-- INTERFACE DO JOGO -->
        <div id="game-interface" style="display: none;">
            
            <!-- BARRA SUPERIOR / HUD -->
            <header class="game-header">
                <div class="window-title">
                    <span id="display-company-name">Minha Empresa</span>
                </div>

                <div class="hud-stats">
                    <div class="stat-item">
                        <small>Capital:</small>
                        <span id="display-money">R$ 0,00</span>
                    </div>
                    <div class="stat-item">
                        <small>Clientes:</small>
                        <span id="display-customers">0</span>
                    </div>
                    <div class="stat-item">
                        <small>Data:</small>
                        <span id="display-date">01/01/2026</span>
                    </div>
                    <button id="pause-btn" class="btn-icon" title="Pausar / Continuar">⏸️</button>
                </div>

                <!-- CONTROLES DA JANELA -->
                <div class="window-controls">
                    <button id="minimize" class="control-btn">-</button>
                    <button id="maximize" class="control-btn">□</button>
                    <button id="close" class="control-btn">×</button>
                </div>
            </header>

            <!-- CORPO DO PAINEL DE JOGO -->
            <div class="game-body">
                <!-- NAVEGAÇÃO POR ABAS (Gerado via JS) -->
                <nav id="navigation-tabs" class="tabs-sidebar"></nav>

                <!-- ÁREA DE CONTEÚDO DINÂMICO (Gerado via JS) -->
                <main id="content-area" class="tab-content"></main>
            </div>

        </div>

    </div>

    <!-- PONTO DE ENTRADA DO JAVASCRIPT (ES MODULES) -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
