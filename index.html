<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telecom Simulator</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main id="game-window">

        <!-- Barra superior -->
        <header id="title-bar">
            <div id="game-title">
                Telecom Simulator
            </div>

            <div id="window-buttons">
                <button id="minimize">−</button>
                <button id="maximize">□</button>
                <button id="close">×</button>
            </div>
        </header>

        <!-- Conteúdo do jogo -->
        <section id="game-content">

            <!-- Menu principal -->
            <div id="main-menu">
                <!-- Botões principais serão colocados aqui -->
            </div>

            <!-- Área do jogo -->
            <div id="game-screen">
                <!-- Abas e conteúdo serão colocados aqui -->
            </div>

        </section>

    </main>

    <script src="js/game.js"></script>
</body>
</html>
